# ============================================================
# Tarn 2.1 示例配置（独立运行）
# ============================================================

tarn:
  # ---------- 数据库 ----------
  datasource:
    type: MYSQL
    pool-type: druid
    # 直连配置优先于连接池配置文件
    url: jdbc:mysql://127.0.0.1:3306/tarn_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: "dfrQ@W#123"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---------- MVC ----------
  mvc:
    controller-type: auto
    intercept-suffix: jspx|jsp|do|u|shtml|rx
    default-view-type: OTHER
    dev-mode: true
    # FreeMarker（2.1 适配，对应老 dev.properties 的 DEFAULT_FREEMARKER_TEMPLATE_UPDATE_DELAY /
    # freemarker_stringLoadTemplate_cache；未配置时框架有安全默认值，不会启动失败）
    freemarker:
      template-update-delay: 3600
      string-template-cache: 60

  # ---------- 系统 ----------
  system:
    debug: true
    encoding: utf-8

  # ---------- 独立运行 ----------
  server:
    port: 9090
    context-path: /
    webapp-dir: web
