driverClassName=com.mysql.jdbc.Driver
url=jdbc:mysql://127.0.0.1:3306/ouhai_wenzheng
username=root
password=dfrQ@W#123
##初始化链接池数量
initialSize=2
##连接池中空闲的链接最少不能低于的连接数
minIdle=2
##连接池中最大的空闲连接数
maxActive=100
##连接池中最大的连接数包括（空闲和不可用）
maxIdle=300
##数据库链接超时时间。这里是以毫秒为单位。
    ## 数据库超时时间最好要与实际数据库设置的超时时间一样。时间可以大于但一定不能小于
    ## 一分钟等于 60*1000=60000毫秒。 一小时等于60*60*1000=3600000毫秒  300*1000
    ## MYSQL数据库默认超时时间是8个小时  28860000
ConnectionTimeout=28860000

##每隔多长时间检测数据库连接，以毫秒为单位。
ConnectionCheck=60000
##数据为MSSQL用到
dbTypeVersion=2008