# MYSQL,MSSQL,ORACLE
DBType=MYSQL
##连接池类型
## 可选项：
##       system  ：系统自带的简单的连接池，默认的
##       c3p0    ：c3p0
##       druid    ：druid
connectionType=druid
connection-config-file=druid.properties

##控制器调度的类型
##目前有三种类型
    ##param  : 参数的执行调用方法，       例 xxx?m=方法名
    ##method : 指定调用方法规则调用，      例 Tarn/dfr/user/${method}.jspx
    ##mapping : mapping方式映射，      例 Tarn/dfr/user/${mapping}
    ##auto   : 自动识别调用，自动识别调用以上两种方案
controller-type=auto

##系统是否是DeBug状态,是deBug状态则会输出SQL，和一些系统反射信息，  true:是，false:否
isBug=true
##是否保存SQL语句到数据库中持久化 SQl LOG 表为：SQLEXECLOG。 不是特殊情况不要将此属性设true,因为这样会影响到服务器系统性能
isSavaSQLexecLog=false


##默认试图类型.目前支持的试图类型
    #JSP,            (jsp文件试图)
    #FREE_MARKER,     （freemarker试图）
    #VELOCITY,         （apache的velocity试图）
    #OTHER;            （其它）
defaultViewType=FREE_MARKER
 ##程序页面渲染编码
encoding=utf-8
##对于freemarker试图，开发模式，true：是，false：不是
devMode=true

##对于只有试图是freemarker试图，同时devMode=false，表示不是开发模式,已秒为单位
DEFAULT_FREEMARKER_TEMPLATE_UPDATE_DELAY = 3600
##系统框架中freemarker stringLoadTemplate 缓存时间 单位为秒
freemarker_stringLoadTemplate_cache=180


#拦截文件后缀名
InterceptSuffix=jspx|jsp|do|u|shtml|rx

##会话变量存储方式，值：session;cookie
ksrType=session
varExpires=-1

##是否需要扩展FIlter，false：不开启，true：开启。
##注：若开启的扩展的filter，需要配置ExtendFilterImpl 实现类，同时该类需要继承FilterInterface接口
ExtendFilter=false
#ExtendFilterImpl=gov.ouhai.wenzheng.business.CheckLoginFilter

##视图模板文件目录   2014-02-20新增
templateBaseDirectory=/WEB-INF/views
## 是否开启多路经模板加载机制 目前只针对freemarker.true:开启。如果开启则需要使用FreeMarkerMultiDirFactory.register() 注册路径方式
isFreeMarkerMultiDir=false
runMode=jar



