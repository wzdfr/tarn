<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>瑞星应用监控平台 monitor 登录</title>
    <link href='css/bootstrap.min.css' rel="stylesheet" >
    <link href='css/bootstrap-theme.min.css' rel="stylesheet" >
    <script type="text/javascript" src="js/jquery.min.js"></script>
    <style type="text/css">
      /* Override some defaults */
      html, body {
        background-color: #eee;
      }
      body {
        padding-top: 40px; 
      }
      .container {
        width: 350px;
      }

      /* The white background content wrapper */
      .container > .content {
        background-color: #fff;
        padding: 20px;
        margin: 0 -20px; 
        -webkit-border-radius: 10px 10px 10px 10px;
           -moz-border-radius: 10px 10px 10px 10px;
                border-radius: 10px 10px 10px 10px;
        -webkit-box-shadow: 0 1px 2px rgba(0,0,0,.15);
           -moz-box-shadow: 0 1px 2px rgba(0,0,0,.15);
                box-shadow: 0 1px 2px rgba(0,0,0,.15);
      }

    .login-form {
      margin-left: 10px;
    }
  
    legend {
      margin-right: -50px;
      font-weight: bold;
      color: #404040;
    }

    </style>

</head>
<body>
  	<div class="container">
      	<div class="content">
          	<div class="row">
              	<div class="login-form">
                  	<h2 align="center">应用监控平台登录</h2>
                    <p style="text-align: right;color: #888;font-size: 15px;font-family: '微软雅黑'; line-height: 30px;"><strong>&nbsp;&nbsp;版本：V1.0.0</strong></p>
                  	<form id="loginForm" method="post" autocomplete="off" >
                      	<fieldset>
                      	  	<div id="alertInfo" class="alert alert-danger" role="alert" style="margin-bottom: 5px;padding: 2px 15px 2px 10px;display: none;">
                      	  		The username or password you entered is incorrect.
						  	</div>
                          	
<div class="input-group  input-group-lg">
  <span class="input-group-addon">用户</span>
  <input type="text" class="form-control" placeholder="用户名" name="loginUsername" >
</div>  
    <div style="height:20px;"></div>                     
<div class="input-group  input-group-lg">
  <span class="input-group-addon">密码</span>
  <input type="password" class="form-control" placeholder="密码" name="loginPassword">
</div>
                            <div style="height:20px;"></div>

<div align="center"></div>
                          	<button id="loginBtn" class="btn btn-primary" type="button">Sign in</button>
                          	<button class="btn" type="reset">Reset</button>
                      	</fieldset>
                  	</form>
              	</div>
          	</div>
      	</div>
  	</div> <!-- /container -->
	<script type="text/javascript">
  		$.namespace("rxMonitor.login");
        rxMonitor.login = function () {
   			return  {
	  			login : function() {
	  				$.ajax({
	  				  type: 'POST',
	  				  url: "submitLogin",
	  				  data: $("#loginForm").serialize(),
	  				  success: function(data) {
	  					if("success" == data)
	  						location.href = "index.html";
	  					else {
	  						$("#alertInfo").show();
	  						$("#loginForm")[0].reset();
	  					}
	  				  },
	  				  dataType: "text"
	  				});
	  			}
   			}
  		}();

  		$(document).ready(function() {
  			$("#loginBtn").click(rxMonitor.login.login);
 		});
  	</script>
</body>
</html>
